<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    background: #0F1B29;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 은은한 배경 그라데이션 + 골드 상단 라인 */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 500px at 50% 30%, rgba(27,58,92,0.55), transparent 70%),
      linear-gradient(180deg, #12233A 0%, #0F1B29 55%);
  }
  .topline {
    position: absolute; top: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(90deg, #C9A227 0%, #E3C24B 50%, #C9A227 100%);
  }
  .frame {
    position: absolute; inset: 28px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .wrap {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .symbol { height: 150px; width: auto; margin-bottom: 44px; }
  .name {
    color: #FFFFFF;
    font-size: 92px;
    font-weight: 700;
    letter-spacing: 0.2em;
    margin-right: -0.2em; /* 끝 글자 자간 보정 */
    line-height: 1;
  }
  .en {
    margin-top: 26px;
    color: #C9A227;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.6em;
    margin-right: -0.6em;
    line-height: 1;
  }
  .divider {
    margin: 40px 0 34px;
    width: 72px; height: 2px;
    background: rgba(255,255,255,0.22);
  }
  .tagline {
    color: #9FB0C2;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.02em;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="topline"></div>
  <div class="frame"></div>
  <div class="wrap">
    <svg class="symbol" viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg">
      <g fill="#FFFFFF">
        <rect x="45.5" y="20" width="9" height="62" rx="2"/>
        <rect x="26" y="42" width="9" height="40" rx="2"/>
        <rect x="65" y="42" width="9" height="40" rx="2"/>
        <rect x="19" y="88" width="62" height="6.5" rx="2"/>
      </g>
      <circle cx="50" cy="10.5" r="4.5" fill="#C9A227"/>
    </svg>
    <div class="name">신라철강</div>
    <div class="en">SILLA STEEL</div>
    <div class="divider"></div>
    <div class="tagline">철근·H빔 납품부터 잔여 철근 매입·수거까지</div>
  </div>
</body>
</html>
